spring:
  datasource:
    driverClassName: org.postgresql.Driver
    url: ${DB_HOST_PROD}
    username: ${DB_USERNAME_PROD}
    password: ${DB_PASSWORD_PROD}
  jpa:
    generate-ddl: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # API configurations for production environment
  api:
    viacep:
      base-url: ${VIACEP_BASE_URL_PROD:https://viacep.com.br}
      
  # Configurações do Apache Kafka para produção
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS_PROD:kafka-prod:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID_PROD:hex-group-prod}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        enable.auto.commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
        batch.size: 16384
        linger.ms: 5

# Tópicos do Kafka para produção
kafka:
  topics:
    person-created: ${KAFKA_TOPIC_PERSON_CREATED_PROD:person-created-prod}