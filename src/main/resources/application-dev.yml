spring:
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST_DEV:localhost:5432/hexdev}
    username: ${DB_USERNAME_DEV:postgres}
    password: ${DB_PASSWORD_DEV:postgres}
  jpa:
    generate-ddl: true
    properties:
      hibernate:
        ddl-auto: update
        #show_sql: true
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # API configurations for development environment
  
  # Configurações do Apache Kafka para desenvolvimento
  kafka:
    enabled: ${KAFKA_ENABLED_DEV:true}
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS_DEV:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID_DEV:hex-group-dev}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      enable-auto-commit: true
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true

api.viacep.base-url: ${VIACEP_BASE_URL_DEV:https://viacep.com.br}

# Resilience4j Circuit Breaker configurations for development
resilience4j:
  circuitbreaker:
    instances:
      viaCepCircuitBreaker:
        register-health-indicator: true
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      personServiceCircuitBreaker:
        register-health-indicator: true
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      addressServiceCircuitBreaker:
        register-health-indicator: true
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      contactServiceCircuitBreaker:
        register-health-indicator: true
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      dependentServiceCircuitBreaker:
        register-health-indicator: true
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

# Tópicos do Kafka para desenvolvimento
kafka:
  topics:
    person-created: ${KAFKA_TOPIC_PERSON_CREATED_DEV:person-created-dev}
